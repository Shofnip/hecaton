# Packaging for Hecaton. Every value here that could have gone another way was
# decided in ADR-0013 (the distribution posture) and, for the format itself, in
# ADR-0020, so the reasoning is named rather than repeated.
#
# Two tests read this file, and neither of them verifies it. tests/artifact.test.ts
# holds the target and the zip's shape to what README.md and release.yml say about
# them, and tests/bundled-browser.test.ts holds the extraResources line to where
# the app looks - both are agreement checks between documents, not evidence about
# a built artifact.
#
# What verifies it is inspecting one: that the renderer still loads from file://
# with its CSP, that the core fakes and spike/ are absent from the package, and
# that the navigation handlers still deny everything. Reading the config proves
# none of that. The last such pass is recorded in architecture.md, under "The
# pre-release security review".

# No domain of the owner's exists (ADR-0013 made one unnecessary), so the appId uses the
# GitHub namespace they do control rather than inventing a company domain.
appId: io.github.shofnip.hecaton
productName: Hecaton
copyright: Copyright 2026 Shofnip

directories:
  output: ../../release
  # `build-resources`, not electron-builder's default `build`, because .gitignore
  # ignores every directory named build/ - so the icon would have been untracked,
  # and the next clone would have packaged the default Electron icon with no error
  # anywhere. A silent wrong artifact is the failure mode this repo keeps hitting.
  buildResources: build-resources

# An explicit list, for the same reason copy-renderer-assets.mjs uses one: the
# package must never carry a file nobody chose to ship. dist/ is the compiled
# output; the workspace packages come in as production dependencies.
files:
  - dist/**
  - package.json
  # Both negations exist because probe P2 caught the first build shipping what it
  # should not: the workspace packages are symlinked into node_modules, and
  # electron-builder copied them whole - src/ included. That put
  # core/src/testing/fakes.ts and 19 *.test.ts files inside app.asar, which makes
  # CLAUDE.md's "the fakes are excluded from the build so they never ship" true of
  # tsc's output and false of the artifact people install. Only dist/ is needed to
  # run.
  - '!node_modules/@hecaton/*/src/**'
  # Source maps go with it: they carry no sourcesContent, only a relative path to
  # ../src/*.ts, so with src/ gone they resolve to nothing. Dead bytes rather than
  # a debugging aid. If readable stack traces in a bug report are wanted later,
  # the fix is `inlineSources` in tsconfig, which makes the maps self-contained -
  # not shipping src/ again.
  - '!node_modules/@hecaton/*/dist/**/*.map'

# electron-builder's publisher is deliberately unused. ADR-0014 rejected
# electron-updater, so generating latest.yml would advertise an update channel
# that does not exist. The release workflow uploads the artifact and its SHA256
# itself. Without this, the build also fails on its last step trying to compute
# update channels.
publish: null

# `compression: maximum` is deliberately NOT set, and the reason has been measured
# three times rather than argued about.
#
# 2026-08-08, on the pre-Chromium zip: it saved 380 KB of 134 MB - 0.27% - for 3.5
# minutes of build time, because it drives LZMA for 7z/NSIS targets and leaves the
# zip's deflate alone. 2026-08-21, on the NSIS installer probe P8 built: 98 bytes
# *larger*. Nothing in either case for it to win.
#
# What the zip costs against LZMA is real and is the price of this format: probe
# P8 measured the identical payload at 316.7 MiB as deflate and 199.9 MiB as LZMA.
# A 7z target would close that gap and is rejected - Windows cannot extract .7z
# without extra software, which defeats the point of handing someone a zip.
#
# A zip the user extracts, not an installer (ADR-0020, which reverses ADR-0019 and
# restores ADR-0013's format). The person this ships to downloads a zip, extracts
# it wherever they like and double-clicks Hecaton.exe; updating is replacing the
# folder, and uninstalling is deleting it. No registry key, no Start-menu entry,
# no uninstaller, and no `elevate.exe` - the NSIS-family targets are what put that
# helper into win-unpacked, so leaving the family removes it.
#
# `win.target` stays a single value for the same reason it did under NSIS: every
# target packages the same win-unpacked, so a list would put one target's
# by-products inside the other's artifact.
#
# What makes this shippable is ADR-0004, decided long before a format was
# considered: nothing the app persists lives beside its binary - it is all under
# %APPDATA%/hecaton - so the extracted folder is disposable and can sit anywhere.
# (Clean-session slots are the one exception, and they write to the OS temp
# directory, which is further from the extracted folder still. See ADR-0005.)
#
# The cost: deleting the folder leaves %APPDATA%/hecaton behind, and the
# persistent profiles there are logged-in sessions. There is no uninstaller to ask
# about that, which is why "Apagar todos os meus dados" is an action inside the
# panel - see ADR-0013's consequences and ADR-0005's 2026-08-08 Correction.
win:
  target: zip
  # Generated by scripts/make-icon.mjs from the panel's own .logo tokens, so the
  # exe carries the identity the app shows in its sidebar. electron-builder
  # converts this into the multi-size .ico. Explicitly not the game's poke.ico,
  # which would present Hecaton as if it were Poke IdleWorld.
  icon: build-resources/icon.png

# Names the platform and architecture, because a zip carries none of the metadata
# an installer would and the file name is all the user has to go on.
artifactName: Hecaton-${version}-win-${arch}.${ext}

# The project's own licence and notice, beside the exe.
#
# Not optional and not decoration: Apache-2.0 §4 obliges whoever distributes the
# binary to include a copy of the License and to keep the NOTICE. An installer
# would satisfy the first half with a licence page; a zip has no page, so the
# files have to travel and the release page publishes a third copy loose, which is
# the one that can be read before running an unsigned executable. Verified
# 2026-08-08 that the first zip shipped neither - it carried only Electron's and
# Chromium's own licences, which are a different obligation.
#
# `.txt` because Windows has no handler for an extensionless LICENSE, and a file a
# user cannot open by double-clicking may as well not be there.
# The changelog travels twice, and the two copies do different jobs. Inside the
# asar (copied into dist/ by the build) it is what the app reads to show what
# changed after an update, at a path identical in development and in the package.
# Beside the exe it is readable without opening the app at all - which matters
# for a zip, where there is no store page and no installer to read anything on the
# way in.
# The browser the app ships (ADR-0016), fetched by scripts/fetch-chromium.mjs
# before this runs. `to:` is joined with process.resourcesPath by
# `bundledBrowserPath`, and tests/bundled-browser.test.ts holds this line, that
# function and the fetch script to the same layout - three files agreeing by eye
# is exactly the kind of agreement that quietly stops being true.
#
# No `filter` here, deliberately. The snapshot's seven unshipped executables are
# already gone by the time this runs, removed by the fetch script, so the browser
# a developer launches is byte-identical to the one in the package. A filter would
# have made those two differ - the class of bug this repository keeps finding.
#
# extraResources rather than extraFiles because it must land under resources/,
# where the same relative path works in development. And a browser is not
# something to put beside the exe where a user can double-click it by accident.
extraResources:
  - from: ../../vendor/chromium/chrome-win
    to: chromium/chrome-win

extraFiles:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE
    to: NOTICE.txt
  - from: ../../CHANGELOG.md
    to: CHANGELOG.txt
