<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Hecaton</title>
    <!-- Same policy as the panel: this is the second lock, the header main
         injects is the first. The overlay only ever draws its own DOM. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <!-- data-mode tells the shared renderer to run as the overlay: no wall, just
       the modals and volume popover, over a transparent background. -->
  <body data-mode="overlay">
    <div id="overlay-root"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
