<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Hecaton</title>
    <!--
      The real policy is the header main injects; this tag is the second lock on
      the same door, and it is what protects the page if the window is ever
      loaded by something that does not go through that listener.

      No 'unsafe-inline' anywhere: there are no inline styles or scripts. Dynamic
      values (theme, thumb height, volume fill) are set through the CSSOM, which
      the policy allows; connect-src 'none' keeps the runtime offline, so the
      favicon and font are bundled, never fetched.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- sidebar (design §4). Icons and handlers are wired by the renderer;
           the structure is fixed, so it lives here rather than being built. -->
      <aside id="sidebar">
        <div class="logo" title="Hecaton">H</div>
        <button id="power-all" type="button" class="icon-btn sidebar-btn power-all"></button>
        <button id="add-screen" type="button" class="icon-btn sidebar-btn add"></button>
        <div class="spacer"></div>
        <button
          id="open-settings"
          type="button"
          class="icon-btn sidebar-btn"
          title="Configurações"
        ></button>
      </aside>

      <main id="stage">
        <p id="config-error" class="error-banner" hidden></p>
        <div id="board"></div>
        <div id="toast" class="toast" hidden></div>
      </main>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
