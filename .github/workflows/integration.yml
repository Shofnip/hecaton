# Integration tests: the real bundled browser, real OS windows, real disk.
#
# Three of the nine suites drive a browser, and all three drive the one the app ships.
# Two of them used to reach for an installed Google Chrome and skip when none was found,
# which stopped being safe the moment the app stopped requiring one - on a correct machine
# they skipped and the run still reported green. They now fail instead.
#
# Manual only, and kept out of ci.yml on purpose. As a skipped job inside CI it
# left every push reporting "1/2", and an indicator that needs interpreting is an
# indicator people stop reading.
#
# Why it does not run automatically:
#
#   It needs an interactive desktop session. Hosted runners have none, so
#   bringToTop and setBounds would pass or fail for reasons unrelated to the code.
#   A job nobody can trust is worse than no job at all.
#
# There used to be a second reason - node-gyp could not build the two native
# modules on the hosted image, because 11.5 did not recognise Visual Studio 18.
# That is gone: node-gyp is 12.4.0 in the lockfile since electron-builder was
# added, and the release workflow now runs `npm ci` and a full packaged build on
# windows-latest. So `npm ci` here is expected to succeed; if this job fails, it
# fails on the tests and on the missing desktop, which is the honest reason.
#
# The authoritative run is local, on Windows: npm run test:integration
# This workflow exists so it can also be triggered from the Actions tab.

name: Integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Two steps, and the order is load-bearing. `npm ci` installs no Electron
      # binary - electron ships no install script - and the fetch script links the
      # bundled browser *under* Electron's own resources directory, so with these
      # reversed the fetch would log "nothing was linked for development" and exit
      # 0, leaving the suite to die in beforeAll with `bundled browser missing at
      # ...`: a failure about this workflow, not about the code it exercises. Same
      # pair, same order, as docs/releasing.md and the README.
      - run: node node_modules/electron/install.js
      - run: node scripts/fetch-chromium.mjs

      - run: npm run test:integration
