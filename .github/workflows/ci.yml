name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # npm 11+ blocks dependency install scripts by default. Native modules
      # (node-window-manager and its transitive extract-file-icon) need explicit
      # allowScripts entries in package.json - a transitive dep is NOT covered by
      # approving its parent. Keep --ignore-scripts here so CI fails loudly if a
      # new package silently expects to run one.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
