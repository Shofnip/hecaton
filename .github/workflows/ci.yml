name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 11+ blocks dependency install scripts by default. Native modules
      # (node-window-manager and its transitive extract-file-icon) need explicit
      # allowScripts entries in package.json - a transitive dep is NOT covered by
      # approving its parent. Keep --ignore-scripts here so CI fails loudly if a
      # new package silently expects to run one.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Integration tests drive real processes and real OS windows, so they need a
  # graphical Windows session. Kept separate from the fast suite on purpose.
  integration:
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration --if-present
