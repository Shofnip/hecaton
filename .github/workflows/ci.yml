name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm 11+ blocks dependency install scripts by default. Native modules
      # (node-window-manager and its transitive extract-file-icon) need explicit
      # allowScripts entries in package.json - a transitive dep is NOT covered by
      # approving its parent. Keep --ignore-scripts here so CI fails loudly if a
      # new package silently expects to run one.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Integration tests launch real Chrome and move real OS windows, so they need
  # an interactive desktop session. Hosted runners do not have one: bringToTop
  # and setBounds would pass or fail for reasons unrelated to the code, and a
  # job nobody can trust is worse than no job at all.
  #
  # They also need node-gyp to build two native modules, which currently fails
  # on the hosted image - node-gyp 11.5 does not recognise the Visual Studio 18
  # it finds there ("unknown version undefined").
  #
  # So this is manual, for when someone wants to run it against a real machine.
  # The authoritative run is local: npm run test:integration on Windows.
  integration:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
