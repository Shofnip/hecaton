# Builds and publishes a release from a tag.
#
# Why this exists rather than uploading a build from the author's machine (D12a):
# the artifact is **unsigned** (D5), so a friend has no certificate to check it
# against. What replaces it is a public log of what went into the binary - a clean
# checkout, `npm ci` from the committed lockfile, and a SHA256 anyone can compare.
# That is not a signature; it is the closest substitute this project can have, and
# it also stops the artifact carrying the state of one machine.
#
# No contradiction with ADR-0007 decision 1, which says CI must not fetch the
# Electron binary: that is about the **verification** pipeline, where `typecheck`
# works from electron.d.ts and `npm ci --ignore-scripts` downloads nothing. A
# release job needs the binary by definition. Different job, different rule.
#
# Deliberately no third-party actions. `gh` is preinstalled on the runner and
# maintained by GitHub, so publishing needs no marketplace action - which matters
# because D12 named build-time packages the largest new surface of this phase: a
# compromised one injects straight into the binary other people execute, and with
# no signature nothing downstream would notice.

name: Release

on:
  push:
    tags: ['v*']
  # So the build can be exercised without creating a release. Publishing is gated
  # on the ref being a tag, below.
  workflow_dispatch:

# Least privilege at the top: read-only by default, and the one job that needs to
# write gets exactly `contents: write` - the minimum that can create a release and
# upload an asset. No PAT is involved: the ephemeral GITHUB_TOKEN is enough, and a
# workflow with publish rights is itself a target.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # No --ignore-scripts here, unlike ci.yml: the two native modules
      # (node-window-manager and its transitive extract-file-icon) have to compile,
      # because electron-builder rebuilds them against Electron's ABI and the
      # packaged app loads them in the main process.
      - run: npm ci

      # A tag that could not pass CI must not become a release.
      - run: npm run check

      # The shipped tree, and only it. Build-time advisories are accepted
      # deliberately (ADR-0013): they are denial-of-service issues in tooling
      # that runs here, over patterns this build itself supplies, and none of it
      # reaches a user's disk. That acceptance leaned on somebody remembering to
      # re-check; this is what makes it a property instead.
      #
      # It lives in the release job rather than in `check`: repo-consistency
      # requires `check` to cover everything CI runs, `check` is offline today,
      # and a registry outage must not turn into a red local run. This job
      # already needs the network and already runs npm ci.
      - name: Refuse to publish an advisory that ships
        run: npm audit --omit=dev

      - name: Check the tag matches the version being packaged
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $version = (Get-Content apps/shell/package.json | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "tag $tag does not match apps/shell version $version - the release would be mislabelled"
          }
          "tag and version agree on $version"

      # The browser the app ships (ADR-0016). Not committed - fetched here from a
      # pinned revision and verified against a pinned SHA256 before anything is
      # unpacked, so what goes into the artifact is the build probe P5 measured
      # rather than whatever the bucket serves today. A mismatch fails the job
      # and nothing is unpacked.
      #
      # Note what this step is NOT covered by: `npm audit --omit=dev` above sees
      # npm dependencies, and 440 MB of Chromium is not one. Its security posture
      # is the revision pin and the release ritual in docs/releasing.md.
      - name: Fetch and verify the bundled Chromium
        run: node scripts/fetch-chromium.mjs

      - run: npm run package --workspace @hecaton/shell

      # The hash is the whole point of an unsigned release, so it is written in the
      # format sha256sum -c reads and published beside the installer. It carries
      # more weight than it looks: the installer is the thing SmartScreen will warn
      # about, and after "Run anyway" there is nothing else between "downloaded
      # from the release page" and "downloaded from somewhere that looked like it".
      - name: Compute the SHA256
        shell: pwsh
        run: |
          # Exactly one, not the first of several - and the second match is real,
          # not hypothetical. electron-builder writes the uninstaller stub beside
          # the installer as `<name>.__uninstaller.exe` (NsisTarget.js:349, read
          # against electron-builder 26.15.3), which matches this glob. It is
          # unlinked again on the success path (NsisTarget.js:302), so the count is
          # one today - by the lifetime of a temp file inside a dependency, which
          # is not what a release should rest on.
          #
          # The count is checked rather than the order, because order is not a
          # property to reason about here. An earlier version of this comment
          # claimed the stub sorts first, from code points - `_` is 0x5F, `e` is
          # 0x65 - and that is wrong: measured on NTFS, in both creation orders,
          # Get-ChildItem returns the real installer first, because the index is
          # ordered by upcased UTF-16 where `E` is 0x45. So `Select-Object -First
          # 1` was not picking the stub; it was resting on an ordering nobody had
          # measured, which is the defect either way.
          #
          # Measured 2026-08-21, by breaking the custom NSIS on purpose: a failed
          # build leaves BOTH `Hecaton-<version>-win-x64.exe` (226 KB, written by
          # the first makensis pass, which targets the real artifact path) and
          # `Hecaton-<version>-win-x64.__uninstaller.exe` (188 KB). Count 2, so
          # this guard fires. It never gets the chance: `npm run package` above
          # exits non-zero and fails the job first. Do not reorder these two steps.
          #
          # SilentlyContinue so a missing release/ reaches the message below rather
          # than dying on a path error: GitHub prepends $ErrorActionPreference =
          # 'stop' to every pwsh block, which is also what makes `throw` fail the
          # step.
          $found = @(Get-ChildItem release/*-win-*.exe -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            throw "expected exactly one installer in release/, found $($found.Count): $($found.Name -join ', ')"
          }
          $installer = $found[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash *$($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii -NoNewline
          "$($installer.Name)  $hash"

          # Decided once, here, behind the check above. The publish step used to
          # re-run the same glob with `Select-Object -First 1`, which put the
          # guard and the use of it in different steps - so a later edit could
          # reintroduce exactly the case the check exists to catch.
          #
          # `utf8` is BOM-less on pwsh 6+, and that matters more than it looks:
          # -Append writes into an already non-empty file, so a BOM would land
          # mid-file and become part of the key name. On Windows PowerShell 5.1
          # the same value emits one, which makes `shell: pwsh` above load-bearing
          # for this line.
          "HECATON_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Apache-2.0 §4, one step ahead of the installer's licence page. The page is
      # shown to somebody who has already decided to run an unsigned executable;
      # these are the copies they can read before that. They are collected from the
      # packaged tree rather than from the repository root so that what the release
      # page serves is byte-identical to what the installer puts on disk.
      #
      # This step failing is what guarantees all three get published, not the
      # `if-no-files-found: error` below: that option is aggregate, so it fires
      # only when *no* pattern matched anything, and a release missing one .txt
      # would upload happily. Copy-Item raises here instead, because GitHub
      # prepends $ErrorActionPreference = 'stop' to every pwsh block.
      - name: Collect the licence, notice and changelog
        shell: pwsh
        run: |
          foreach ($file in 'LICENSE.txt', 'NOTICE.txt', 'CHANGELOG.txt') {
            Copy-Item "release/win-unpacked/$file" "release/$file"
          }

      # Kept even when not publishing, so a workflow_dispatch run is inspectable.
      - uses: actions/upload-artifact@v7
        with:
          name: hecaton-installer
          path: |
            release/*-win-*.exe
            release/*-win-*.exe.sha256
            release/LICENSE.txt
            release/NOTICE.txt
            release/CHANGELOG.txt
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # $env:HECATON_INSTALLER is the path the SHA step resolved and checked;
          # nothing is globbed again here, deliberately. The three .txt paths are
          # literal and expand fine - PowerShell does not glob for native commands,
          # which is why the old `release/*-win-*.exe` had to be resolved before
          # `gh` ever saw it.
          #
          # Unbraced on purpose. "${env:HECATON_INSTALLER.sha256}" would NOT append
          # a suffix: the braced form allows dots inside the name, so it would look
          # up a variable literally called `HECATON_INSTALLER.sha256` and expand to
          # nothing. The bare form terminates the name at the dot, because `.` is
          # not a variable-name character. Measured, and true in 5.1 and 7 alike.
          gh release create '${{ github.ref_name }}' `
            $env:HECATON_INSTALLER "$env:HECATON_INSTALLER.sha256" `
            release/LICENSE.txt release/NOTICE.txt release/CHANGELOG.txt `
            --title 'Hecaton ${{ github.ref_name }}' `
            --generate-notes
