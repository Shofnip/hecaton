# Builds and publishes a release from a tag.
#
# Why this exists rather than uploading a build from the author's machine (D12a):
# the artifact is **unsigned** (D5), so a friend has no certificate to check it
# against. What replaces it is a public log of what went into the binary - a clean
# checkout, `npm ci` from the committed lockfile, and a SHA256 anyone can compare.
# That is not a signature; it is the closest substitute this project can have, and
# it also stops the artifact carrying the state of one machine.
#
# No contradiction with ADR-0007 decision 1, which says CI must not fetch the
# Electron binary: that is about the **verification** pipeline, where `typecheck`
# works from electron.d.ts and `npm ci --ignore-scripts` downloads nothing. A
# release job needs the binary by definition. Different job, different rule.
#
# Deliberately no third-party actions. `gh` is preinstalled on the runner and
# maintained by GitHub, so publishing needs no marketplace action - which matters
# because D12 named build-time packages the largest new surface of this phase: a
# compromised one injects straight into the binary other people execute, and with
# no signature nothing downstream would notice.

name: Release

on:
  push:
    tags: ['v*']
  # So the build can be exercised without creating a release. Publishing is gated
  # on the ref being a tag, below.
  workflow_dispatch:

# Least privilege at the top: read-only by default, and the one job that needs to
# write gets exactly `contents: write` - the minimum that can create a release and
# upload an asset. No PAT is involved: the ephemeral GITHUB_TOKEN is enough, and a
# workflow with publish rights is itself a target.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # No --ignore-scripts here, unlike ci.yml: the two native modules
      # (node-window-manager and its transitive extract-file-icon) have to compile,
      # because electron-builder rebuilds them against Electron's ABI and the
      # packaged app loads them in the main process.
      - run: npm ci

      # A tag that could not pass CI must not become a release.
      - run: npm run check

      # The shipped tree, and only it. Build-time advisories are accepted
      # deliberately (ADR-0013): they are denial-of-service issues in tooling
      # that runs here, over patterns this build itself supplies, and none of it
      # reaches a user's disk. That acceptance leaned on somebody remembering to
      # re-check; this is what makes it a property instead.
      #
      # It lives in the release job rather than in `check`: repo-consistency
      # requires `check` to cover everything CI runs, `check` is offline today,
      # and a registry outage must not turn into a red local run. This job
      # already needs the network and already runs npm ci.
      - name: Refuse to publish an advisory that ships
        run: npm audit --omit=dev

      - name: Check the tag matches the version being packaged
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $version = (Get-Content apps/shell/package.json | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "tag $tag does not match apps/shell version $version - the release would be mislabelled"
          }
          "tag and version agree on $version"

      - run: npm run package --workspace @hecaton/shell

      # The hash is the whole point of an unsigned release, so it is written in the
      # format sha256sum -c reads and published beside the zip. It matters more for
      # a zip than it did for an installer: there is no install step at all, so the
      # hash is the only thing between "downloaded from the release page" and
      # "downloaded from somewhere that looked like it".
      - name: Compute the SHA256
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-win-*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash *$($zip.Name)" | Out-File "$($zip.FullName).sha256" -Encoding ascii -NoNewline
          "$($zip.Name)  $hash"

      # Kept even when not publishing, so a workflow_dispatch run is inspectable.
      - uses: actions/upload-artifact@v7
        with:
          name: hecaton-zip
          path: |
            release/*-win-*.zip
            release/*-win-*.zip.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The paths are expanded here on purpose: PowerShell does not glob for
          # native commands, so gh would receive `release/*-win-*.zip` literally.
          $zip = (Get-ChildItem release/*-win-*.zip | Select-Object -First 1).FullName
          gh release create '${{ github.ref_name }}' $zip "$zip.sha256" `
            --title 'Hecaton ${{ github.ref_name }}' `
            --generate-notes
